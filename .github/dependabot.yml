version: 2

# One weekly PR covering both ecosystems below, instead of a PR per dependency.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  # Keeps GitHub Actions pinned/current; pairs with the SHA-pinning note in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  # The one runtime dependency (cryptography) plus the dev tooling, tracked via uv.lock.
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
