version: 2
updates:
  # Keeps GitHub Actions pinned/current; pairs with the SHA-pinning note in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The one runtime dependency (cryptography) plus the dev tooling, tracked via uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
